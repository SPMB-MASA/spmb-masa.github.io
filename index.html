<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPMB MA SYAMSUL ARIFIN</title>
    
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/JWcFmSGR/logo-MA-Syamsul-Arifin.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .loading-card { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 400px; width: 100%; }
        .logo-img { width: 95px; height: auto; margin-bottom: 20px; filter: drop-shadow(0px 4px 8px rgba(40, 167, 69, 0.2)); }
        .btn-redirect { background-color: #28a745; color: white; font-weight: 600; border: none; padding: 12px 24px; border-radius: 10px; transition: all 0.3s ease; text-decoration: none; display: inline-block; }
        .btn-redirect:hover { background-color: #218838; color: white; }
    </style>
</head>
<body>

    <div class="loading-card text-center">
        <img src="https://i.ibb.co.com/JWcFmSGR/logo-MA-Syamsul-Arifin.png" alt="Logo MA" class="logo-img">
        <h5 class="fw-bold text-success mb-1">SPMB MA SYAMSUL ARIFIN</h5>
        <p class="text-muted small mb-4">Menghubungkan ke Server Formulir Resmi...</p>
        
        <div class="spinner-border text-success mb-4" role="status" style="width: 2.5rem; height: 2.5rem;">
            <span class="visually-hidden">Loading...</span>
        </div>

        <div id="boxManual" style="display: none;" class="mt-2 border-top pt-3">
            <p class="small text-danger mb-3">Sistem keamanan HP Anda menahan pengalihan otomatis.</p>
            <!-- MASUKKAN LINK BARU HASIL DEPLOY DI SINI (GANTI KODE DI BAWAH) -->
            <a id="linkManual" href="https://script.google.com/macros/s/AKfycbznIf3GN1tlf8wu1EpXiSqXFheKjvuANkFzZf-Rj3BJZmRQllAYxMJsE-htDDKwpmjsfA/exec" class="btn-redirect w-100">
                Buka Formulir Pendaftaran
            </a>
        </div>
    </div>

    <script>
        // MASUKKAN LINK BARU HASIL DEPLOY DI SINI (GANTI KODE DI BAWAH)
        var linkTujuan = "https://script.google.com/macros/s/AKfycbznIf3GN1tlf8wu1EpXiSqXFheKjvuANkFzZf-Rj3BJZmRQllAYxMJsE-htDDKwpmjsfA/exec";

        setTimeout(function() {
            window.location.replace(linkTujuan);
        }, 1000);

        setTimeout(function() {
            document.getElementById("boxManual").style.display = "block";
        }, 3500);
    </script>

</body>
</html>
